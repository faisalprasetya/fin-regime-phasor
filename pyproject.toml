[project]
name = "fin-regime-phasor"
version = "0.1.0"
description = "Complex phasor features (Parkinson-volatility magnitude, arctan-mapped phase) fed into an HQMM for financial regime detection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hmmlearn>=0.3.3",
    "jax>=0.11.0",
    "matplotlib>=3.11.1",
    "optax>=0.2.8",
    "polars>=1.43.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[project.scripts]
fin-regime-phasor = "fin_regime_phasor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin_regime_phasor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/fin_regime_phasor/cli/*.py" = ["B008"]  # typer.Option(...) as a default arg is the idiomatic typer pattern
